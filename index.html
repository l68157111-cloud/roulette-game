<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backshot Roulette</title>
<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #111;
  color: white;
  text-align: center;
}
.player {
  border: 2px solid white;
  margin: 10px;
  padding: 10px;
}
.flash-red { background: #800; }
.flash-green { background: #064; }

button {
  font-size: 18px;
  margin: 5px;
  padding: 10px;
}

#log {
  min-height: 60px;
  margin-top: 10px;
}
</style>
</head>

<body>

<h1>Backshot Roulette</h1>
<h2 id="roundInfo"></h2>

<div class="player" id="A">
  <h3>A</h3>
  ❤️ <span id="hpA"></span>
  <div id="itemsA"></div>
</div>

<div class="player" id="B">
  <h3>B</h3>
  ❤️ <span id="hpB"></span>
  <div id="itemsB"></div>
</div>

<div>
  <button onclick="shoot('self')">自分に撃つ</button>
  <button onclick="shoot('other')">相手に撃つ</button>
</div>

<div id="log"></div>

<script>
/* ===== 基本データ ===== */
const maxHP = [0,3,5,6];
const itemPerRound = [0,3,4,5];
let round = 1;
let turn = 'A';

let players = {
  A: { hp: 3, items: [] },
  B: { hp: 3, items: [] }
};

let bullets = [];
let sawed = false;

/* ===== アイテム ===== */
const ITEMS = [
  "虫眼鏡","ビール","タバコ","手錠",
  "ノコギリ","使い捨て携帯","インバータ",
  "アドレナリン","期限切れ薬"
];

function randomItem() {
  let pool = ITEMS.filter(i=>i!=="タバコ");
  if (Math.random()<0.08) return "タバコ";
  return pool[Math.floor(Math.random()*pool.length)];
}

/* ===== ラウンド開始 ===== */
function startRound() {
  players.A.hp = maxHP[round];
  players.B.hp = maxHP[round];
  players.A.items = [];
  players.B.items = [];
  reload();
  updateUI();
}

/* ===== 装填 ===== */
function reload() {
  bullets=[];
  let total = Math.floor(Math.random()*6)+3;
  let real = Math.floor(total/2)+Math.floor(Math.random()*3)-1;
  real = Math.max(1, Math.min(real, total-1));
  while (Math.abs(real-(total-real))>2) real--;
  let blank = total-real;
  bullets = Array(real).fill("real").concat(Array(blank).fill("blank"));
  bullets.sort(()=>Math.random()-0.5);

  ["A","B"].forEach(p=>{
    for(let i=0;i<itemPerRound[round];i++){
      if(players[p].items.length<8)
        players[p].items.push(randomItem());
    }
  });

  log(`🔄 再装填：実弾${real} 空弾${blank}`);
}

/* ===== 発砲 ===== */
function shoot(target) {
  if(bullets.length===0) return;

  let shooter = turn;
  let victim = (target==="self") ? shooter : (shooter==="A"?"B":"A");

  log(`${shooter} → ${victim}`);

  setTimeout(()=>{
    let bullet = bullets.shift();
    if(bullet==="real"){
      document.body.className="flash-red";
      players[victim].hp -= sawed ? 2 : 1;
    } else {
      document.body.className="flash-green";
    }
    sawed=false;

    setTimeout(()=>{
      document.body.className="";
      checkState(bullet, shooter, victim);
    },500);
  },4000);
}

/* ===== 状態判定 ===== */
function checkState(bullet, shooter, victim){
  if(players[victim].hp<=0){
    round++;
    if(round>3){
      log("🎉 ゲーム終了");
      return;
    }
    startRound();
    return;
  }

  if(bullets.length===0){
    reload();
  }

  if(!(bullet==="blank" && shooter===victim)){
    turn = shooter==="A"?"B":"A";
  }

  updateUI();
}

/* ===== UI ===== */
function updateUI(){
  document.getElementById("roundInfo").textContent = `ラウンド ${round} / 手番 ${turn}`;
  hpA.textContent = players.A.hp;
  hpB.textContent = players.B.hp;
  itemsA.textContent = players.A.items.join(" , ");
  itemsB.textContent = players.B.items.join(" , ");
}

function log(t){
  document.getElementById("log").textContent = t;
}

/* ===== 初期化 ===== */
startRound();
</script>

</body>
</html>
