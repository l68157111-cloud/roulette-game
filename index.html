<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>オンライン・バックショットルーレット</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body {
  background:#111;
  color:#fff;
  font-family:sans-serif;
  text-align:center;
}
.player {
  border:2px solid #555;
  margin:10px;
  padding:10px;
}
.flash-red { background:#800; }
.flash-green { background:#060; }
.log { min-height:80px; margin-top:10px; }
button { font-size:16px; margin:5px; }
</style>
</head>
<body>

<h2>バックショットルーレット（対人）</h2>

<div>
  あなたの名前：
  <input id="nameInput">
  <button onclick="join()">参加</button>
</div>

<div class="player" id="p1"></div>
<div id="centerText"></div>
<div class="player" id="p2"></div>

<div>
  <button onclick="shoot('self')">自分に撃つ</button>
  <button onclick="shoot('enemy')">相手に撃つ</button>
  <button onclick="useBeer()">🍺 ビール</button>
</div>

<div class="log" id="log"></div>

<script>
// ===== Firebase設定（★ここだけ自分のに変更）=====
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
// ===============================================

let playerName = "";
let playerId = "";

function join(){
  playerName = nameInput.value.trim();
  if(!playerName) return;
  const ref = db.ref("players").push();
  playerId = ref.key;
  ref.set({ name: playerName, hp:3 });
}

function shoot(target){
  showCenter(target === "self" ? "あなた→あなた" : "あなた→相手");
  setTimeout(()=>{
    const live = Math.random() < 0.5;
    flash(live ? "red" : "green");
    log((live?"実弾":"空弾")+"が出ました");
  },4000);
}

function useBeer(){
  log("ビールを使用。弾を1発捨てました");
}

function showCenter(text){
  centerText.innerText = text;
}

function flash(color){
  document.body.className = color==="red"?"flash-red":"flash-green";
  setTimeout(()=>document.body.className="",500);
}

function log(t){
  log.innerText = t;
}
</script>

</body>
</html>
