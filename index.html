<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backshot Roulette</title>

<style>
body {
  background:#111;
  color:white;
  font-family:sans-serif;
  text-align:center;
  margin:0;
}
.player {
  border:2px solid #555;
  padding:10px;
  margin:10px;
}
#center {
  height:60px;
  font-size:22px;
  display:flex;
  align-items:center;
  justify-content:center;
}
#log {
  min-height:60px;
  font-size:14px;
  color:#ccc;
}
button {
  padding:10px;
  margin:5px;
  font-size:16px;
}
.item {
  background:#333;
}
.flash-red { background:#500 !important; }
.flash-green { background:#050 !important; }
.hidden { display:none; }
</style>
</head>

<body>

<h2>Backshot Roulette</h2>

<div class="player">
  <div>player1 ❤️ <span id="hp1"></span></div>
</div>

<div id="center"></div>

<div class="player">
  <div>player2 ❤️ <span id="hp2"></span></div>
</div>

<div id="log"></div>

<div id="actions"></div>
<div id="items"></div>

<script>
// =====================
// 状態
// =====================
let round = 1;
let current = 1;
let bullets = [];
let sawPower = 1;
let handcuff = {1:false,2:false};

const maxHP = {1:3,2:5,3:6};
const itemGain = {1:3,2:4,3:5};

const players = {
  1:{hp:3,items:[]},
  2:{hp:3,items:[]}
};

const ITEMS = [
  "虫眼鏡","ビール","タバコ","手錠",
  "ノコギリ","使い捨て携帯","アドレナリン",
  "インバータ","期限切れ薬"
];

// =====================
// 初期化
// =====================
startRound();

function startRound(){
  players[1].hp = maxHP[round];
  players[2].hp = maxHP[round];
  players[1].items = [];
  players[2].items = [];
  loadBullets();
  giveItems();
  current = Math.random()<0.5?1:2;
  log(`Round ${round} 開始 / 先攻: player${current}`);
  render();
}

// =====================
// 弾
// =====================
function loadBullets(){
  bullets=[];
  let total = rand(3,8);
  let real = Math.floor(total/2);
  let blank = total-real;
  if(Math.abs(real-blank)>2){
    real = Math.floor(total/2);
    blank = total-real;
  }
  for(let i=0;i<real;i++) bullets.push(true);
  for(let i=0;i<blank;i++) bullets.push(false);
  shuffle(bullets);
  log(`装填：実弾${real} 空弾${blank}（5秒表示）`);
}

// =====================
// アイテム
// =====================
function giveItems(){
  for(let p of [1,2]){
    while(players[p].items.length < 8 && players[p].items.length < itemGain[round]){
      players[p].items.push(ITEMS[rand(0,ITEMS.length-1)]);
    }
  }
}

// =====================
// UI
// =====================
function render(){
  hp1.textContent = players[1].hp;
  hp2.textContent = players[2].hp;
  actions.innerHTML="";
  items.innerHTML="";
  center.textContent="";

  if(handcuff[current]){
    handcuff[current]=false;
    switchTurn();
    return;
  }

  addBtn("自分に撃つ",()=>shoot(current,current));
  addBtn("相手に撃つ",()=>shoot(current,other()));

  players[current].items.forEach((it,i)=>{
    addItem(it,i);
  });
}

function addBtn(t,f){
  let b=document.createElement("button");
  b.textContent=t;
  b.onclick=f;
  actions.appendChild(b);
}
function addItem(t,i){
  let b=document.createElement("button");
  b.textContent=t;
  b.className="item";
  b.onclick=()=>useItem(i);
  items.appendChild(b);
}

// =====================
// 射撃
// =====================
function shoot(from,to){
  actions.innerHTML="";
  items.innerHTML="";
  center.textContent=`player${from} → player${to}`;

  setTimeout(()=>{
    if(bullets.length===0){
      loadBullets();
      giveItems();
    }

    let bullet = bullets.shift();
    if(bullet){
      flash("red");
      players[to].hp -= sawPower;
    }else{
      flash("green");
    }
    sawPower=1;

    if(players[to].hp<=0){
      round++;
      if(round>3){
        log(`player${from} 勝利`);
        return;
      }
      startRound();
      return;
    }

    if(to===from && !bullet){
      render();
    }else{
      switchTurn();
    }
  },4000);
}

// =====================
// アイテム効果
// =====================
function useItem(i){
  let it = players[current].items.splice(i,1)[0];
  log(`player${current} は ${it} を使用`);

  if(it==="ビール"){
    if(bullets.length===0){ loadBullets(); giveItems(); }
    let b=bullets.shift();
    log(b?"実弾が出ました":"空弾が出ました");
    render(); return;
  }
  if(it==="タバコ"){
    players[current].hp=Math.min(players[current].hp+1,maxHP[round]);
  }
  if(it==="手錠"){
    handcuff[other()]=true;
  }
  if(it==="ノコギリ"){
    sawPower=2;
  }
  if(it==="インバータ"){
    bullets = bullets.map(b=>!b);
  }
  if(it==="期限切れ薬"){
    Math.random()<0.5 ? players[current].hp+=2 : players[current].hp-=1;
    players[current].hp=Math.min(players[current].hp,maxHP[round]);
  }
  render();
}

// =====================
function switchTurn(){
  current=other();
  render();
}
function other(){ return current===1?2:1; }
function flash(c){
  document.body.classList.add(c==="red"?"flash-red":"flash-green");
  setTimeout(()=>document.body.classList.remove("flash-red","flash-green"),500);
}
function log(t){ document.getElementById("log").textContent=t; }
function rand(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} }
</script>

</body>
</html>
